<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vault Cleaner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      color-scheme: dark;
      width: 284px;
      margin: 0;
      padding: 18px;
      background: #11191e;
      color: #f0f5f3;
      font: 13px/1.5 system-ui, sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.3px; }
    p { margin: 0 0 14px; color: #abb9c2; }
    a {
      display: block;
      padding: 9px 12px;
      margin-bottom: 6px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: #b9e68e;
      color: #182619;
      text-align: center;
      text-decoration: none;
      font-weight: 650;
    }
    a:hover { background: #caefa8; }
    a:focus-visible { outline: 2px solid #b9e68e; outline-offset: 2px; }
    .secondary { background: #18232a; border-color: #2d3b43; color: #f0f5f3; }
    .secondary:hover { background: #22323a; }
    .note { margin: 12px 0 0; font-size: 11px; text-align: center; }
    @media (prefers-reduced-motion: no-preference) {
      a { transition: background-color 130ms ease-out; }
    }
  </style>
</head>
<body>
  <h1>Vault Cleaner</h1>
  <p>Open DIM and click Vault Cleaner in the bottom-right corner.</p>
  <a href="https://app.destinyitemmanager.com/" target="_blank" rel="noopener">Open DIM ↗</a>
  <a class="secondary" href="https://www.light.gg/god-roll/roll-appraiser/?vaultcleaner=sync" target="_blank" rel="noopener">Sync light.gg ↗</a>
  <p class="note">Items are dismantled in-game.</p>
</body>
</html>
